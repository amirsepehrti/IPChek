<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IPChek — country IP ranges for routers and firewalls</title>
<meta name="description" content="Pick a country, get ready-to-paste config for MikroTik, FortiGate, Cisco, iptables, nftables, pfSense and 20 more. Runs entirely in your browser.">
<meta name="color-scheme" content="dark light">
<meta property="og:title" content="IPChek — country IP ranges for routers and firewalls">
<meta property="og:description" content="Pick a country, get ready-to-paste config for MikroTik, FortiGate, Cisco, iptables, nftables, pfSense and 20 more. Runs entirely in your browser.">
<meta property="og:type" content="website">
<meta property="og:image" content="./screenshot-overview.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="./css/app.css">
<link rel="stylesheet" href="./css/static.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23111315'/%3E%3Crect x='2' y='3' width='12' height='2.2' fill='%23ffb020'/%3E%3Crect x='2' y='6.9' width='8' height='2.2' fill='%23ffb020' opacity='.72'/%3E%3Crect x='2' y='10.8' width='4.5' height='2.2' fill='%23ffb020' opacity='.45'/%3E%3C/svg%3E">
</head>
<body dir="ltr">

<header class="rail">
  <a class="brand" href="./" aria-label="IPChek">
    <svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true">
      <rect x="1" y="2.2" width="14" height="2.6" rx="0.6" fill="var(--amber)"/>
      <rect x="1" y="6.7" width="9.5" height="2.6" rx="0.6" fill="var(--amber)" opacity="0.72"/>
      <rect x="1" y="11.2" width="5" height="2.6" rx="0.6" fill="var(--amber)" opacity="0.45"/>
    </svg>
    <span>IPChek</span>
  </a>

  <span class="chip nowrap" id="no-server-chip"></span>

  <div class="rail-actions right">
    <a class="btn ghost nowrap" id="gh-link" href="https://github.com/amirsepehrti/IPChek" target="_blank" rel="noopener"></a>
    <button id="lang-toggle" class="ghost" title="زبان / Language" aria-label="Switch language">فا</button>
    <button id="theme-toggle" class="ghost icon" title="Theme" aria-label="Switch theme">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
        <path d="M8 1a7 7 0 100 14A7 7 0 008 1zm0 1.6v10.8a5.4 5.4 0 010-10.8z"/>
      </svg>
    </button>
  </div>
</header>

<main>

  <section class="hero">
    <h1 data-t="web.tagline"></h1>
    <p class="lede" data-t="web.lede"></p>
  </section>

  <!-- ─────────────────────────────────────────────────── 1. the country -->
  <section class="section">
    <p class="eyebrow" data-t="web.step1"></p>

    <div class="panel">
      <div class="toolbar">
        <label class="field grow">
          <span data-t="common.country"></span>
          <select id="country"></select>
        </label>
        <label class="field">
          <span data-t="common.family"></span>
          <select id="family">
            <option value="4">IPv4</option>
            <option value="6">IPv6</option>
          </select>
        </label>
        <label class="field">
          <span data-t="common.source"></span>
          <select id="source"></select>
        </label>
      </div>

      <p class="muted source-weight" id="source-weight"></p>

      <div id="range-state" class="range-state"></div>
      <div id="map-host"></div>
    </div>
  </section>

  <!-- ──────────────────────────────────────────────────── 2. the device -->
  <section class="section">
    <p class="eyebrow" data-t="web.step2"></p>

    <div class="panel">
      <div class="toolbar">
        <label class="field grow">
          <span data-t="export.format"></span>
          <select id="format"></select>
        </label>
        <label class="field">
          <span data-t="export.listName"></span>
          <input id="list-name" autocomplete="off" placeholder="IR-v4">
        </label>
        <label class="field">
          <span data-t="export.action"></span>
          <select id="action">
            <option value="block" data-t="export.actionBlock"></option>
            <option value="allow" data-t="export.actionAllow"></option>
          </select>
        </label>
      </div>

      <label class="check" style="margin-top:12px">
        <input type="checkbox" id="aggregate" checked>
        <span data-t="export.aggregate"></span>
      </label>

      <p class="note" id="format-note"></p>
    </div>
  </section>

  <!-- ──────────────────────────────────────────────────── 3. the output -->
  <section class="section">
    <p class="eyebrow" data-t="web.step3"></p>

    <div class="panel">
      <div class="panel-head">
        <div class="row">
          <button class="primary" id="download" data-t="export.download"></button>
          <button id="copy" data-t="export.copy"></button>
        </div>
        <span class="muted" id="output-summary"></span>
      </div>
      <pre class="output" id="output"></pre>
    </div>
  </section>

  <!-- ───────────────────────────────────────────────────── the watch bit -->
  <section class="section">
    <p class="eyebrow" data-t="web.snapshotTitle"></p>

    <div class="panel">
      <p class="muted" style="margin-top:0" data-t="web.snapshotBody"></p>
      <div id="snapshot-state"></div>
      <div class="row" style="margin-top:12px">
        <button id="snapshot-save"></button>
        <button class="ghost danger" id="snapshot-forget" data-t="web.forget" hidden></button>
      </div>
      <p class="note" style="margin-top:14px" data-t="web.snapshotScheduled"></p>
    </div>
  </section>

  <!-- ────────────────────────────────────────────────────────── the fine print -->
  <section class="section grid cols-2">
    <div class="panel">
      <p class="eyebrow" data-t="web.sourceNote"></p>
      <p class="muted" style="margin:0" data-t="web.sourceNoteBody"></p>
    </div>
    <div class="panel">
      <p class="eyebrow" data-t="web.selfHosted"></p>
      <p class="muted" style="margin:0 0 12px" data-t="web.selfHostedBody"></p>
      <div class="url-row"><code>docker compose up -d</code></div>
    </div>
  </section>

</main>

<footer>
  <span class="ltr">IPChek</span> ·
  <a href="https://github.com/amirsepehrti/IPChek" target="_blank" rel="noopener">GitHub</a> ·
  <span data-t="about.footerNote"></span>
</footer>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
