name: Deploy the static build to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow one deployment at a time; let a running one finish rather than
# cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Assemble the site
        run: node scripts/build-static.mjs

      - name: Check the assembled imports resolve
        run: node scripts/check-static.mjs

      # Pages has to be switched on once by hand, under
      # Settings → Pages → Source → GitHub Actions. This step reads that
      # configuration; it cannot create it. `enablement: true` was tried and the
      # workflow token is not allowed to call the create-a-Pages-site API, which
      # fails with a "Resource not accessible by integration" that says nothing
      # about the actual missing step.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
