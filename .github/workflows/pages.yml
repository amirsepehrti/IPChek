name: Deploy the static build to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow one deployment at a time; let a running one finish rather than
# cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Assemble the site
        run: node scripts/build-static.mjs

      - name: Check the assembled imports resolve
        run: node scripts/check-static.mjs

      # Turns Pages on the first time this runs, so there is no manual step in
      # repository settings. Needs Pages to be available on the account's plan.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
