name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20.x", "22.x", "24.x"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run tests
        run: npm test

      - name: Check the server boots and serves the API
        run: |
          SYNC_ON_START=false SYNC_INTERVAL_MINUTES=0 PORT=8123 node src/server.js &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            sleep 1
            curl -fsS http://127.0.0.1:8123/api/health && break
          done
          curl -fsS http://127.0.0.1:8123/api/meta > /dev/null
          curl -fsS http://127.0.0.1:8123/ | grep -q IPChek

  static:
    name: Verify the static build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Assemble and check
        run: npm run check:static
      - name: Check the page loads its entry module
        run: |
          npx --yes http-server _site -p 8100 -c-1 --silent &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            sleep 1
            curl -fsS http://127.0.0.1:8100/ > /dev/null && break
          done
          curl -fsS http://127.0.0.1:8100/ | grep -q 'js/app.js'
          curl -fsS http://127.0.0.1:8100/js/app.js > /dev/null
          curl -fsS http://127.0.0.1:8100/src/exporters/index.js > /dev/null
          curl -fsS http://127.0.0.1:8100/src/lib/ipnet.js > /dev/null

  docker:
    name: Build the container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ipchek:ci
      - name: Smoke test the image
        run: |
          docker run -d --name ipchek-ci -p 8080:8080 \
            -e SYNC_ON_START=false -e SYNC_INTERVAL_MINUTES=0 ipchek:ci
          for i in $(seq 1 30); do
            sleep 1
            curl -fsS http://127.0.0.1:8080/api/health && break
          done
          curl -fsS http://127.0.0.1:8080/api/meta > /dev/null
          docker rm -f ipchek-ci
